title: "kyle speaks on..."
description: "can you believe this was $3 for a whole year of fun?."
url: "https://kylenotbrandon.blog"
permalink: /blog/:year/:month/:day/:title/

# Apps Script web app URL (Deploy → Web app → ends with /exec). See docs/newsletter-setup.md.
newsletter:
  apps_script_url: "https://script.google.com/macros/s/AKfycbwWbn0zTTb0cdbeIxnV_D7Uz-e3dCnSJiwq6B1fI2Zn0XYbKDdf5UymrEQxpwC19k6ccw/exec"

plugins:
  - jekyll-paginate
  - jekyll-feed

paginate: 5
paginate_path: "/page:num/"

markdown: kramdown
highlighter: rouge

exclude:
  - .github
  - docs
  - Gemfile
  - Gemfile.lock
  - README.md
  # CI / local: gems live here — Jekyll must not scan them (would try to parse gem _posts templates)
  - vendor
  - .bundle

sass:
  style: compressed
