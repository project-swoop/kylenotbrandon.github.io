<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{POST_TITLE}}</title>
</head>
<body style="margin:0;padding:0;background-color:#3a6ea4;font-family:Tahoma,'MS Sans Serif',Verdana,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#3a6ea4;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:520px;border:2px solid #0054e3;background-color:#ece9d8;">
          <tr>
            <td style="padding:6px 10px;background-color:#0a42c7;background-image:linear-gradient(#3c81f3,#0a42c7);color:#ffffff;font-size:13px;font-weight:bold;">
              {{SITE_TITLE}}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 18px;color:#000000;font-size:13px;line-height:1.45;">
              <p style="margin:0 0 8px;font-size:12px;color:#404040;">New post · {{POST_DATE}}</p>
              <h1 style="margin:0 0 14px;font-size:20px;line-height:1.25;font-weight:bold;color:#000000;">{{POST_TITLE}}</h1>
              <p style="margin:0 0 18px;color:#000000;">{{POST_EXCERPT}}</p>
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td style="border:2px solid #7c7c7c;border-top-color:#ffffff;border-left-color:#ffffff;background-color:#ece9d8;">
                    <a href="{{POST_URL}}" style="display:inline-block;padding:6px 14px;font-size:13px;font-weight:bold;color:#000000;text-decoration:none;">Read on the blog &rarr;</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:12px 18px 16px;border-top:2px groove #d4d0c8;font-size:11px;line-height:1.5;color:#404040;">
              You subscribed at <a href="{{SITE_URL}}" style="color:#0000ee;">{{SITE_URL}}</a>.<br>
              <a href="{{UNSUBSCRIBE_URL}}" style="color:#0000ee;">Unsubscribe</a> in one click.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
